[project]
name = "rally"
version = "0.1.0"
description = "SAPO - Plataforma de alerta y limpieza preventiva de sumideros (piloto Engativá / Humedal Jaboque)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "ultralytics>=8.4.180",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.1",
]

[project.scripts]
rally = "rally:main"
sapo-api = "rally.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
